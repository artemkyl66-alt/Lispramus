<!DOCTYPE html>
<html>
<head>
  <title>IDEF0 Generator</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: row; margin: 0; min-height: 100vh;}
    .left { flex: 1; padding: 20px; background: #282c34; color: #abb2bf; font-family: monospace; white-space: pre-wrap;}
    .right { flex: 2; padding: 20px; background: #fafafa; display: flex; align-items: center; justify-content: center; overflow: auto; border-left: 2px solid #ccc; }
    svg { border: 1px dashed #ccc; padding: 100px; background: white;}
  </style>
</head>
<body>
  <div class="left" id="text-area">
  </div>
  <div class="right">
    <img id="diagram" src="" />
  </div>

  <script>
    const config = [
      {
        text: `;; Lisp Data Representation for Single Styled Node Diagram
(list
  (make-node :id "A0"
             :title "Закупочная деятельность предприятия"
             :inputs '("Статистика продаж" "Решение о закупке руководством"
                       "Заявка со склада" "Поставщики" "Товар от поставщика")
             :input-colors '("#1dac15" "#1dac15" "#1dac15" "#1dac15" "#1dac15")
             :outputs '("Поставленный товар" "Документы на закупленный товар")
             :output-colors '("#ff0000" "#ff0000")
             :controls '("Законодательные акты" "Конъюнктура рынка" "Метод закупки товаров")
             :mechanisms '("Сотрудники" "ПК, средства связи")
             :mechanism-colors '("#89b9b4" "#0101ae")))`,
        img: 'diagram1.svg'
      },
      {
        text: `;; Lisp Data Representation for Single Node (Default Colors)
(list
  (make-node :id "A1"
             :title "Закупочная деятельность предприятия"
             :inputs '("Статистика продаж" "Решение о закупке руководством"
                       "Заявка со склада" "Поставщики" "Товар от поставщика")
             :outputs '("Поставленный товар" "Документы на закупленный товар")
             :controls '("Законодательные акты" "Конъюнктура рынка" "Метод закупки товаров")
             :mechanisms '("Сотрудники" "ПК, средства связи")))`,
        img: 'diagram2.svg'
      },
      {
        text: `;; Lisp Data Representation for Decomposition Diagram
(list
  (make-node :id "choice" :title "Выбор поставщиков")
  (make-node :id "order" :title "Формирование заказа")
  (make-node :id "control" :title "Контроль исполнения заказов")
  (make-node :id "return" :title "Возврат товаров поставщику"))

(list
  (make-connection "choice" "order" :side :input :label "Список поставщиков")
  (make-connection "order" "order" :side :control :label "График выполнения поставок")
  (make-connection "order" "control" :side :control :label "График выполнения поставок")
  (make-connection "order" "control" :side :control :label "Договор")
  (make-connection "order" "return" :side :control :label "Договор")
  (make-connection "order" "control" :side :input :label "Заказ")
  (make-connection "order" "control" :side :input :label "Требование подтверждения")
  (make-connection "control" "order" :side :input :label "Отказ принятия заказа")
  (make-connection "control" "return" :side :input :label "Неудовлетворяющий требованиям товар"))`,
        img: 'diagram3.svg'
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const view = params.get('view') || '0';
    const active = config[parseInt(view, 10)];

    document.getElementById('text-area').innerText = active.text;
    document.getElementById('diagram').src = active.img;
  </script>
</body>
</html>
